project_id = "sams-v2"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
# Keep public self-registration disabled while allowing provisioned users to sign in.
enable_signup = false
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.email]
# This enables the email/password provider; the global auth setting above still
# blocks public account creation. Admin-provisioned demo users can sign in.
enable_signup = true
